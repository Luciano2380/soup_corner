[pytest]
testpaths = tests
pythonpath = src
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    ollama: exige o Ollama rodando com os modelos de LLM_MODEL e LLM_EMBEDDING (lento)
    google_maps: chama a Google Routes API real (cobrada); só roda com RUN_GOOGLE_MAPS_TESTS=1
filterwarnings =
    ignore::DeprecationWarning:langchain_core.*
    ignore:`langchain-community` is being sunset:DeprecationWarning
    ignore::langchain_core._api.deprecation.LangChainDeprecationWarning
